name: Daily Stock Digest

on:
  schedule:
    - cron: "0 0 * * 1-5"  # 매일 09:00 KST (UTC 00:00), 평일만
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily digest
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
        run: python daily_digest.py

      - name: Commit dashboard
        if: always()
        run: |
          git config user.name "daily-stock-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/index.html
          git diff --staged --quiet || git commit -m "chore: update daily dashboard $(date +'%Y-%m-%d')"
          git push

      - name: Rotate Kakao refresh token if changed
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -f .kakao_new_refresh_token ]; then
            gh secret set KAKAO_REFRESH_TOKEN --body "$(cat .kakao_new_refresh_token)"
            rm -f .kakao_new_refresh_token
          fi
